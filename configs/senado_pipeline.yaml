    extractor: "ipolitico.extractors.senado.api.processos.SenadoProcessosDocumentosExtractor"
    transformer: "ipolitico.transformers.senado.processos_transformer.SenadoProcessosDocumentosTransformer"
  votacoes_senado:
    extractor: "ipolitico.extractors.senado.api.votacoes_senado.SenadoVotacoesExtractor"
    transformer: "ipolitico.transformers.senado.votacoes_senado_transformer.SenadoVotacoesTransformer"
