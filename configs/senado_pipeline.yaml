  processos_detalhe:
    extractor: "ipolitico.extractors.senado.api.processos.SenadoProcessosDetalheExtractor"
    transformer: "ipolitico.transformers.senado.processos_transformer.SenadoProcessosDetalheTransformer"
  processos_emendas:
    extractor: "ipolitico.extractors.senado.api.processos.SenadoProcessosEmendasExtractor"
