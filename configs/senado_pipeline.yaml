# Mapeamento dinâmico de dependências para a API do Senado Federal
domain_configs:
  senadores:
    extractor: "ipolitico.extractors.senado.api.senadores.SenadoSenadoresExtractor"
    transformer: "ipolitico.transformers.senado.senadores_transformer.SenadoSenadoresTransformer"
  senadores_detalhe:
    extractor: "ipolitico.extractors.senado.api.senadores_detalhe.SenadoSenadoresDetalheExtractor"
    transformer: "ipolitico.transformers.senado.senadores_detalhe_transformer.SenadoSenadoresDetalheTransformer"
  processos:
    extractor: "ipolitico.extractors.senado.api.processos.SenadoProcessosExtractor"
