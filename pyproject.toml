[project]
name = "ipolitico-etl"
version = "0.1.0"
description = "ETL Open Source, neutro e determinístico para dados da política brasileira."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx",
    "polars",
    "pydantic",
    "respx",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ativa verificação de Erros (E), Pyflakes (F), Avisos (W) e ordenação automática de imports (I)
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}